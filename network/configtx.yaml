# ---------------------------------------------------------------------------
# Configtx configuration for Channel medralink-main
# Raft Consensus, 4-Org Consortium (3+1)
# ---------------------------------------------------------------------------

Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/orderer.medralink.org/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &Org1
    Name: Org1MSP
    ID: Org1MSP
    MSPDir: crypto-config/peerOrganizations/org1.hospital-a.medralink.org/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org1MSP.admin', 'Org1MSP.peer', 'Org1MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org1MSP.admin', 'Org1MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org1MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org1MSP.peer')"
    AnchorPeers:
      - Host: peer0.org1.hospital-a.medralink.org
        Port: 7051

  - &Org2
    Name: Org2MSP
    ID: Org2MSP
    MSPDir: crypto-config/peerOrganizations/org2.hospital-b.medralink.org/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org2MSP.admin', 'Org2MSP.peer', 'Org2MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org2MSP.admin', 'Org2MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org2MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org2MSP.peer')"
    AnchorPeers:
      - Host: peer0.org2.hospital-b.medralink.org
        Port: 8051

  - &Org3
    Name: Org3MSP
    ID: Org3MSP
    MSPDir: crypto-config/peerOrganizations/org3.operator.medralink.org/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Org3MSP.admin', 'Org3MSP.peer', 'Org3MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Org3MSP.admin', 'Org3MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Org3MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Org3MSP.peer')"

  - &OrgAuditor
    Name: OrgAuditorMSP
    ID: OrgAuditorMSP
    MSPDir: crypto-config/peerOrganizations/orgauditor.dghs.medralink.org/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrgAuditorMSP.admin', 'OrgAuditorMSP.peer', 'OrgAuditorMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('OrgAuditorMSP.admin')"
      Admins:
        Type: Signature
        Rule: "OR('OrgAuditorMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('OrgAuditorMSP.peer')"

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Read:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Write:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admin:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer1.medralink.org:7050
    - orderer2.medralink.org:7050
    - orderer3.medralink.org:7050
  EtcdRaft:
    Consenters:
      - Host: orderer1.medralink.org
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/orderer.medralink.org/orderers/orderer1.medralink.org/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/orderer.medralink.org/orderers/orderer1.medralink.org/tls/server.crt
      - Host: orderer2.medralink.org
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/orderer.medralink.org/orderers/orderer2.medralink.org/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/orderer.medralink.org/orderers/orderer2.medralink.org/tls/server.crt
      - Host: orderer3.medralink.org
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/orderer.medralink.org/orderers/orderer3.medralink.org/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/orderer.medralink.org/orderers/orderer3.medralink.org/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 100
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 2 MB
  Organizations:
    - *OrdererOrg
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  MedralinkGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Consortiums:
      MedralinkConsortium:
        Organizations:
          - *Org1
          - *Org2
          - *Org3
          - *OrgAuditor

  MedralinkMainChannel:
    Consortium: MedralinkConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Org1
        - *Org2
        - *Org3
        - *OrgAuditor
      Capabilities: *ApplicationCapabilities
